<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Khuyến nghị</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recommend.css') }}">
</head>

<body class="bg-light">
    <div class="container py-3">

        <header class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 mb-0">Khuyến nghị</h1>
            {% include "partials/menu.html" %}
        </header>

        {% include "partials/timeframe.html" %}

        <section class="card">
            <div class="card-body p-0" style="max-width: 640px; margin: 0 auto;">
                <table class="table table-sm table-hover mb-0" id="reco-table">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" colspan="2" class="text-center align-middle">Khoảng thời gian</th>
                            <th>Khuyến nghị</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <nav class="d-flex justify-content-center mt-3">
            <ul class="pagination" id="pagination"></ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/recommend.js') }}"></script>
</body>

</html>
