<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitcoin Forecast</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
</head>

<body class="bg-light">
    <div class="container py-3">
        <header class="d-flex align-items-center justify-content-between mb-3">
            <h1 class="h4 mb-0 fw-bold text-primary">BITCOIN FORECAST</h1>

            {% include "partials/menu.html" %}
        </header>

        <section class="row mb-3 g-3 align-items-stretch">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">
                        <p class="mb-1 text-muted small fw-bold">GIÁ ĐÓNG CỬA</p>
                        <div class="h3 mb-0 fw-bold" id="last-price">$0</div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">
                        <p class="mb-1 text-muted small fw-bold">ĐỘ TIN CẬY AI</p>
                        <div class="h3 mb-0 fw-bold" id="forecast-price">0%</div>
                        <div class="small text-muted" id="forecast-change">Confidence Score</div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body text-center">
                        <p class="mb-1 text-muted small fw-bold">KHUYẾN NGHỊ</p>
                        <div class="h3 mb-0 fw-bold" id="recommend-text">—</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="card mb-3 shadow-sm border-0">
            <div class="card-body p-0" style="height: 500px; position: relative; overflow: hidden;">
                <div id="chart" style="width:100%; height:100%;"></div>
            </div>
        </section>
        
        {% include "partials/timeframe.html" %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
